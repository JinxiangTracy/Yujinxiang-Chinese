<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yujinxiang Vocabulary · HSK 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ================= BASE ================= */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#FFFAF1;
  color:#2C3A34;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  padding-bottom:60px;
  transition:background .3s, color .3s;
}
.zh, .zh *{
  font-family:"Kaiti SC","STKaiti","KaiTi","楷体","Kaiti TC","Noto Serif SC","Songti SC",serif;
}
.zh .latin, .zh .latin *{
  font-family:'Montserrat',sans-serif !important;
}

/* ================= HEADER ================= */
.site-header{
  position:relative;
  background:linear-gradient(135deg,#DFFAEE 0%,#B4EDD4 40%,#8FDCC0 75%,#7ACFAF 100%);
  padding:32px 24px 26px;
  overflow:hidden;
  transition:filter .3s;
}
.site-header::before{
  content:'';
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 12% 20%, rgba(255,255,255,.55), transparent 45%),
    radial-gradient(circle at 88% 75%, rgba(255,255,255,.35), transparent 50%);
  pointer-events:none;
}
.header-inner{
  max-width:1060px;margin:0 auto;
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  position:relative;z-index:2;
}
.brand h1{
  margin:0 0 6px;
  font-size:clamp(24px,3.6vw,38px);
  font-weight:700;
  letter-spacing:-.6px;
  color:#1B4B37;
  line-height:1.15;
}
.brand h1 em{
  font-style:normal;
  font-weight:500;
  color:#2C7A57;
  letter-spacing:-.3px;
}
.tagline{
  margin:0;
  font-size:13px;
  font-weight:500;
  color:#2F6B52;
  letter-spacing:.4px;
  opacity:.9;
}
.tagline b{ font-weight:700; }
.tulip-art{
  flex:0 0 auto;
  filter:drop-shadow(0 8px 16px rgba(27,75,55,.15));
  animation:sway 6s ease-in-out infinite;
}
@keyframes sway{
  0%,100%{transform:rotate(-1.5deg)}
  50%{transform:rotate(1.5deg)}
}
@media(max-width:640px){
  .tulip-art svg{width:130px;height:auto}
}

/* ================= UNIT NAV ================= */
.unit-nav{
  position:sticky;top:0;z-index:60;
  background:rgba(255,250,241,.94);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #EDE1C9;
  box-shadow:0 4px 18px -10px rgba(60,50,30,.35);
  padding:10px 0;
  transition:background .3s, border-color .3s;
}
.unit-list{
  display:flex;gap:8px;
  overflow-x:auto;
  padding:4px 22px;
  max-width:1060px;margin:0 auto;
  scrollbar-width:thin;
  scrollbar-color:#D9CBB0 transparent;
}
.unit-list::-webkit-scrollbar{height:6px}
.unit-list::-webkit-scrollbar-thumb{background:#E2D6BC;border-radius:99px}
.unit-btn{
  flex:0 0 auto;
  width:40px;height:40px;
  border-radius:12px;
  border:1.6px solid var(--b-line);
  background:var(--b-soft);
  color:var(--b-deep);
  font-family:inherit;
  font-weight:700;font-size:13px;
  cursor:pointer;
  transition:transform .18s, box-shadow .18s, background .18s;
  position:relative;
}
.unit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px -8px rgba(0,0,0,.4)}
.unit-btn.active{
  background:var(--b-deep);
  color:#fff;
  border-color:var(--b-deep);
  transform:translateY(-2px);
  box-shadow:0 8px 18px -8px rgba(0,0,0,.45);
}
.unit-btn.completed::after{
  content:'';
  position:absolute;
  top:-2px;right:-2px;
  width:10px;height:10px;
  border-radius:50%;
  background:#FFD166;
  border:2px solid #fff;
  box-shadow:0 0 0 1px #d0a835;
}

/* ================= MAIN ================= */
main{
  max-width:1060px;
  margin:0 auto;
  padding:28px 20px 40px;
}

/* ================= UNIT CARD ================= */
.unit-card{
  background:var(--uc-soft);
  border:1.6px solid var(--uc-line);
  border-radius:28px;
  padding:clamp(18px,3vw,34px);
  box-shadow:0 24px 60px -34px rgba(50,60,45,.5);
  animation:fadeUp .4s ease both;
  transition:background .3s, border-color .3s;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
.unit-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
  padding-bottom:16px;
  border-bottom:2px dashed var(--uc-line);
  margin-bottom:18px;
}
.unit-kicker{
  font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;
  font-weight:700;color:var(--uc-deep);opacity:.65;
}
.unit-title{
  margin:4px 0 0;
  font-size:clamp(22px,3.2vw,30px);
  font-weight:700;
  color:var(--uc-deep);
  line-height:1.25;
}
.unit-title-vi{
  font-size:.58em;
  font-weight:600;
  opacity:.72;
  margin-left:8px;
  letter-spacing:.5px;
}
.unit-badge{
  background:#fff;
  border:1.5px solid var(--uc-line);
  color:var(--uc-deep);
  font-size:12.5px;
  font-weight:600;
  padding:6px 14px;
  border-radius:999px;
  white-space:nowrap;
  transition:background .3s;
}

/* ================= PROGRESS BAR ================= */
.progress-bar{
  display:flex;align-items:center;gap:14px;
  padding:10px 0 18px;
  margin-bottom:20px;
  border-bottom:1px dashed var(--uc-line);
  flex-wrap:wrap;
}
.progress-track{
  flex:1;
  min-width:120px;
  height:9px;
  background:rgba(255,255,255,.65);
  border:1px solid var(--uc-line);
  border-radius:99px;
  overflow:hidden;
  position:relative;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--uc-mid),var(--uc-deep));
  border-radius:99px;
  transition:width .5s ease;
  width:0%;
}
.progress-label{
  font-size:12.5px;font-weight:600;
  color:var(--uc-deep);
  white-space:nowrap;
}
.progress-label b{font-size:14px}

/* ================= BLOCK ================= */
.block{margin-bottom:34px}
.block:last-child{margin-bottom:6px}
.block-title{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:17px;font-weight:700;
  color:var(--uc-deep);
  margin:0 0 16px;
}
.block-title .badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:50%;
  background:#fff;
  border:1.5px solid var(--uc-line);
  font-size:15px;
  flex:0 0 auto;
}
.block-title .vi{
  font-family:'Montserrat',sans-serif;
  font-size:12.5px;
  font-weight:500;
  opacity:.68;
  font-style:italic;
}
.title-speaker{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;
  border-radius:50%;
  background:#fff;
  border:1.5px solid var(--uc-line);
  cursor:pointer;
  color:var(--uc-deep);
  padding:0;
  transition:transform .16s, box-shadow .16s, background .16s;
  margin-left:4px;
}
.title-speaker:hover{
  transform:translateY(-1px) scale(1.05);
  box-shadow:0 6px 14px -8px rgba(0,0,0,.45);
  background:var(--uc-mid);
}
.title-speaker svg{width:15px;height:15px}

/* ================= WORD GRID ================= */
.word-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(128px,1fr));
  gap:10px;
}
.word-chip{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.78);
  border:1px solid var(--uc-line);
  border-radius:14px;
  padding:9px 12px;
  cursor:pointer;
  transition:transform .18s, box-shadow .18s, background .18s;
  user-select:none;
}
.word-chip:hover{
  background:#fff;
  transform:translateY(-2px);
  box-shadow:0 10px 22px -14px rgba(0,0,0,.55);
}
.word-chip:active{transform:translateY(0)}
.w-idx{
  font-size:10.5px;font-weight:700;
  color:var(--uc-deep);opacity:.5;
  min-width:15px;
}
.word-chip .zh{font-size:18px;font-weight:600;line-height:1.3;flex:1}
.w-speaker{
  width:15px;height:15px;
  color:var(--uc-deep);
  opacity:.42;
  transition:opacity .18s, transform .18s;
  flex:0 0 auto;
}
.word-chip:hover .w-speaker{opacity:1;transform:scale(1.08)}

/* ================= NOTES ================= */
.note{
  background:rgba(255,255,255,.78);
  border:1px solid var(--uc-line);
  border-left:4px solid var(--uc-line);
  border-radius:14px;
  padding:14px 18px;
  margin-bottom:12px;
  transition:box-shadow .2s, transform .2s;
}
.note:hover{
  box-shadow:0 12px 28px -20px rgba(0,0,0,.6);
  transform:translateX(2px);
}
.note-head{
  display:flex;align-items:baseline;flex-wrap:wrap;
  gap:6px 10px;
  margin-bottom:6px;
}
.note-idx{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;padding:0 6px;
  border-radius:7px;
  background:var(--uc-mid);
  color:var(--uc-deep);
  font-size:11.5px;font-weight:700;
}
.note-word{
  font-size:21px;font-weight:700;
  color:#1D2E26;
  line-height:1.2;
}
.note-pinyin{
  font-family:'Montserrat',sans-serif;
  font-size:13px;font-weight:600;
  color:var(--uc-deep);
  background:var(--uc-soft);
  border:1px solid var(--uc-line);
  padding:0 9px;border-radius:7px;
}
.note-pos{
  font-family:'Montserrat',sans-serif;
  font-size:11.5px;font-style:italic;
  color:#7C6A4E;
  background:#F6EEDC;
  padding:0 7px;border-radius:6px;
}
.note-vi{
  font-family:'Montserrat',sans-serif;
  font-size:13.5px;font-weight:500;
  color:#3E5C4D;
}
.note-col{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:14px;
  color:#4A6B58;
  margin:4px 0 2px;
}
.note-col .tag{
  font-size:10.5px;font-weight:700;
  letter-spacing:.6px;
  background:#F6EEDC;color:#8A7350;
  padding:1px 8px;border-radius:5px;
}
.note-ex{
  list-style:none;margin:8px 0 0;padding:0;
}
.note-ex li{
  position:relative;
  padding-left:30px;
  font-size:16px;
  color:#2F3A34;
  line-height:1.95;
}
.note-ex li + li{margin-top:4px}
.note-ex .hl{
  text-decoration:underline;
  text-decoration-thickness:2px;
  text-underline-offset:4px;
  text-decoration-color:var(--uc-line);
  font-weight:700;
  color:var(--uc-deep);
}
.note-ex .ex-text{ color:inherit; }
.speak-btn{
  position:absolute;
  left:0;top:6px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:22px;height:22px;
  padding:0;
  background:transparent;
  border:1.5px solid var(--uc-line);
  border-radius:50%;
  cursor:pointer;
  color:var(--uc-deep);
  opacity:.55;
  transition:opacity .16s, transform .16s, background .16s;
}
.speak-btn:hover{opacity:1;transform:scale(1.08);background:#fff}
.speak-btn svg{width:11px;height:11px}
.speak-btn:active{transform:scale(.95)}

/* ================= EXERCISES ================= */
.exercise{
  background:rgba(255,255,255,.74);
  border:1px solid var(--uc-line);
  border-radius:18px;
  padding:16px 18px 18px;
  margin-bottom:16px;
}
.ex-title{
  font-size:14.5px;
  font-weight:700;
  color:var(--uc-deep);
  margin:0 0 3px;
  line-height:1.6;
}
.ex-sub{
  font-size:12.5px;
  color:#77857D;
  margin:0 0 14px;
  font-style:italic;
}
.sub-block{
  border-top:1px dashed #E7DFCD;
  padding-top:14px;
  margin-top:14px;
}
.sub-block:first-of-type{border-top:none;padding-top:0;margin-top:0}
.sub-label{
  font-size:12.5px;font-weight:700;
  color:#7B6C53;
  letter-spacing:.4px;
  margin-bottom:10px;
}

/* --- pinyin --- */
.pinyin-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
}
.py-item{display:flex;flex-direction:column;gap:4px}
.py-word{font-size:20px;font-weight:700;color:#1D2E26;line-height:1.2}
.py-input{
  font-family:'Montserrat',sans-serif;
  font-size:13.5px;
  padding:7px 10px;
  border:1.5px solid #DFD6C2;
  border-radius:10px;
  background:#fff;
  color:#2C3A34;
  outline:none;
  transition:.18s;
  width:100%;
}
.py-input::placeholder{color:#C3B9A4;font-style:italic}
.py-input:focus{
  border-color:var(--uc-line);
  box-shadow:0 0 0 3px var(--uc-soft);
}
.py-input.ok{border-color:#3DBE7C;background:#EEFBF3}
.py-input.no{border-color:#E86A6A;background:#FFF1F1}
.py-fb{
  font-family:'Montserrat',sans-serif;
  font-size:11.5px;min-height:15px;color:#C0504D;font-weight:600;
}

/* --- matching --- */
.match-wrap{
  display:grid;
  grid-template-columns:1fr 1.35fr;
  gap:12px;
}
@media(max-width:640px){.match-wrap{grid-template-columns:1fr}}
.match-col{display:flex;flex-direction:column;gap:8px}
.match-item{
  font-family:'Montserrat',sans-serif;
  text-align:left;
  padding:9px 14px;
  border-radius:12px;
  border:1.5px solid #DFD6C2;
  background:#fff;
  cursor:pointer;
  font-size:13.5px;
  color:#2C3A34;
  transition:transform .16s, background .16s, border-color .16s;
  line-height:1.5;
}
.match-item:hover{border-color:var(--uc-line);background:var(--uc-soft)}
.match-item.sel{
  border-color:var(--uc-deep);
  background:var(--uc-mid);
  box-shadow:0 0 0 3px var(--uc-soft);
  transform:translateY(-1px);
}
.match-item.matched{
  border-color:#3DBE7C;
  background:#EDFAF2;
  color:#22794F;
  cursor:default;
  opacity:.9;
}
.match-item.wrong{
  border-color:#E86A6A;background:#FFEFEF;
  animation:shake .35s;
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  75%{transform:translateX(5px)}
}
#matchLeft .match-item .zh{font-size:18px;font-weight:700}
.match-status{
  margin-top:10px;
  font-family:'Montserrat',sans-serif;
  font-size:12.5px;font-weight:600;
  color:#7B6C53;
}

/* --- fill in blank --- */
.fill-group{
  border-top:1px dashed #E7DFCD;
  padding-top:14px;
  margin-top:14px;
}
.fill-group:first-of-type{border-top:none;padding-top:0;margin-top:0}
.fill-options{
  display:flex;flex-wrap:wrap;gap:8px;
  margin-bottom:12px;
  padding:9px 11px;
  background:var(--uc-soft);
  border-radius:12px;
}
.opt-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:#fff;
  border:1px solid var(--uc-line);
  border-radius:999px;
  padding:2px 12px;
  font-size:13.5px;
}
.opt-pill b{color:var(--uc-deep);font-size:11.5px}
.fill-list{margin:0;padding-left:22px}
.fill-list li{margin-bottom:9px;font-size:15px;line-height:2.1}
.fill-select{
  font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
  font-size:15px;
  padding:2px 8px;
  border-radius:8px;
  border:1.5px solid #D9D0BD;
  background:#fff;
  color:#2C3A34;
  cursor:pointer;
  margin:0 3px;
  outline:none;
  transition:.16s;
}
.fill-select:hover{border-color:var(--uc-line)}
.fill-select.ok{border-color:#3DBE7C;background:#EDFAF2;color:#22794F}
.fill-select.no{border-color:#E86A6A;background:#FFEFEF;color:#C0504D}

/* --- multiple choice --- */
.mc-list{margin:0;padding-left:22px}
.mc-item{margin-bottom:15px}
.mc-q{font-size:16px;line-height:1.9;margin-bottom:8px;color:#25372D}
.mc-opts{display:flex;flex-wrap:wrap;gap:8px}
.mc-opt{
  font-family:inherit;
  font-size:13.5px;
  padding:5px 14px;
  border-radius:10px;
  border:1.5px solid #DFD6C2;
  background:#fff;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition:transform .16s, background .16s, border-color .16s;
  color:#2C3A34;
}
.mc-opt b{color:#A3937A;font-size:11.5px}
.mc-opt:hover{border-color:var(--uc-line);background:var(--uc-soft);transform:translateY(-1px)}
.mc-opt.sel{border-color:var(--uc-deep);background:var(--uc-mid)}
.mc-opt.ok{border-color:#3DBE7C;background:#EDFAF2}
.mc-opt.ok b{color:#22794F}
.mc-opt.no{border-color:#E86A6A;background:#FFEFEF}
.mc-opt.no b{color:#C0504D}

/* --- buttons --- */
.btn-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.btn{
  font-family:inherit;
  font-size:13.5px;font-weight:600;
  padding:8px 20px;
  border-radius:11px;
  border:none;
  cursor:pointer;
  background:var(--uc-deep);
  color:#fff;
  transition:transform .16s, filter .16s, box-shadow .16s;
  letter-spacing:.2px;
}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(0,0,0,.9)}
.btn:active{transform:translateY(0)}
.btn.ghost{
  background:transparent;
  color:var(--uc-deep);
  border:1.5px solid var(--uc-line);
}
.btn.ghost:hover{background:var(--uc-soft)}
.btn.small{padding:6px 15px;font-size:12.5px}

/* ================= FLOATING BUTTONS ================= */
.float-btn{
  position:fixed;
  width:52px;height:52px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px -10px rgba(0,0,0,.4);
  transition:transform .2s, box-shadow .2s, background .3s;
  z-index:100;
  background:#fff;
  color:var(--uc-deep, #2C7A57);
}
.float-btn:hover{
  transform:translateY(-3px) scale(1.05);
  box-shadow:0 16px 32px -12px rgba(0,0,0,.5);
}
.float-btn svg{width:24px;height:24px}

#flowerBtn{
  top:22px;right:22px;
  background:linear-gradient(135deg,#FFF1F8,#FAD6E8);
  position:fixed;
  border:2px solid #fff;
}
#flowerBtn .count-badge{
  position:absolute;
  top:-4px;right:-4px;
  background:#E86A6A;
  color:#fff;
  font-size:11px;
  font-weight:700;
  border-radius:99px;
  padding:2px 7px;
  border:2px solid #fff;
  min-width:22px;
  text-align:center;
}

#themeBtn{
  bottom:22px;left:22px;
  background:#FFF8E1;
  border:2px solid #fff;
}
body.dark #themeBtn{
  background:#2A2E2A;
  color:#FFE082;
  border-color:#3a3e3a;
}

/* ================= FLOWER PANEL ================= */
.flower-panel{
  position:fixed;
  top:84px;right:22px;
  width:min(420px, calc(100vw - 44px));
  max-height:calc(100vh - 110px);
  background:#fff;
  border-radius:22px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.4);
  border:1.5px solid #EDE1C9;
  z-index:99;
  display:none;
  flex-direction:column;
  overflow:hidden;
}
.flower-panel.open{ display:flex; }
.flower-panel-head{
  padding:18px 22px 14px;
  background:linear-gradient(135deg,#FFF1F8,#FCE4EF);
  border-bottom:1px solid #F4D6E5;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
}
.flower-panel-head h3{
  margin:0;
  font-size:17px;
  font-weight:700;
  color:#8A2C5A;
  display:flex;align-items:center;gap:8px;
}
.flower-panel-head .collect-count{
  font-size:12.5px;
  font-weight:600;
  background:#fff;
  color:#8A2C5A;

.close-panel{

  width:30px;height:30px;
  cursor:pointer;
  color:#8A2C5A;
  font-size:20px;
  border-radius:8px;
  transition:background .15s;
  display:flex;align-items:center;justify-content:center;
  padding:0;
}
.close-panel:hover{background:rgba(255,255,255,.7)}

.flower-panel-sub{
  padding:10px 22px;
  font-size:12px;
  color:#8A7350;
  background:#FFFDF7;
  border-bottom:1px solid #F6EEDC;
  font-style:italic;
}

.flower-grid{
  flex:1;
  overflow-y:auto;
  padding:16px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(84px,1fr));
  gap:10px;
  background:#FFFCF5;
}
.flower-slot{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding:8px 4px;
  border-radius:14px;
  background:#fff;
  border:1.5px solid #EDE1C9;
  cursor:pointer;
  transition:transform .16s, box-shadow .16s, background .16s;
  position:relative;
}
.flower-slot.locked{
  background:#F6F2E9;
  border-style:dashed;
  opacity:.65;
}
.flower-slot.locked .flower-emoji{ filter:grayscale(1); opacity:.4; }
.flower-slot.locked .flower-name{ color:#B5A98F; }
.flower-slot.unlocked:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 22px -12px rgba(0,0,0,.35);
  background:#FFF8FA;
}
.flower-slot .slot-idx{
  position:absolute;
  top:4px;left:6px;
  font-size:9.5px;
  font-weight:700;
  color:#C4B69A;
}
.flower-slot .flower-emoji{ line-height:1; }
.flower-slot .flower-name{
  font-size:11.5px;
  font-weight:600;
  color:#6B5B42;
  text-align:center;
  line-height:1.2;
}
.flower-slot .flower-emoji.small{ font-size:22px; }

/* flower detail modal */
.flower-detail{
  position:fixed;
  inset:0;
  background:rgba(20,20,20,.55);
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  backdrop-filter:blur(4px);
}
.flower-detail.open{ display:flex; }
.flower-detail-card{
  background:#fff;
  border-radius:24px;
  padding:30px 32px;
  max-width:380px;
  width:100%;
  text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.5);
  animation:popIn .3s ease both;
  position:relative;
}
@keyframes popIn{
  from{opacity:0;transform:scale(.92)}
  to{opacity:1;transform:scale(1)}
}
.flower-detail-card .big-flower{ font-size:64px; line-height:1; margin-bottom:10px; }
.flower-detail-card h4{
  margin:0 0 4px;
  font-size:22px;
  color:#8A2C5A;
}
.flower-detail-card .detail-meaning{
  font-size:14px;
  color:#6B5B42;
  font-style:italic;
  margin:0 0 18px;
}
.flower-detail-card .detail-unit{
  display:inline-block;
  font-size:12px;
  background:#FCE4EF;
  color:#8A2C5A;
  padding:4px 14px;
  border-radius:99px;
  font-weight:600;

.flower-detail-close{
  position:absolute;
  top:10px;right:12px;
  background:none;border:none;
  font-size:22px;
  cursor:pointer;
  color:#aaa;
  width:32px;height:32px;
  border-radius:8px;
}
.flower-detail-close:hover{background:#f5f5f5;color:#666}

/* ================= TOAST ================= */
.toast{
  position:fixed;
  top:90px;
  left:50%;
  transform:translate(-50%,-20px);
  background:#fff;
  border:2px solid #FFD166;
  border-radius:18px;
  padding:14px 22px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.45);

  pointer-events:none;
  transition:opacity .35s, transform .35s;
  display:flex;
  align-items:center;
  gap:14px;
  max-width:min(420px, calc(100vw - 40px));

.toast.show{

.toast .toast-flower{

}
.toast .toast-meaning{
  font-size:12px;
  color:#9A8578;
  margin:2px 0 0;

}

  const t = i / (UNIT_COUNT - 1);

/* =========================================================
   5. 语音
   ========================================================= */
let zhVoice = null;
let readingAll = false;

function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if(!voices.length) return;
  const zhVoices = voices.filter(v => /^(zh|cmn)/i.test(v.lang));
  const femaleHints = ['xiaoxiao','xiaoyi','yaoyao','ting-ting','tingting','mei-jia','meijia',
                       'sin-ji','sinji','huihui','yating','hanhan','zhiyu','female','女'];
  for(const v of zhVoices){
    const n = (v.name || '').toLowerCase();
    if(femaleHints.some(h => n.includes(h))){ zhVoice = v; return; }
  }
  zhVoice = zhVoices[0] || null;
}

if('speechSynthesis' in window){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}

function speak(text, rate){
  if(!('speechSynthesis' in window) || !text) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = typeof rate === 'number' ? rate : 0.92;
  u.pitch = 1.05;
  if(zhVoice) u.voice = zhVoice;
  window.speechSynthesis.speak(u);
}

function speakAll(words){
  if(!('speechSynthesis' in window) || !words || !words.length) return;
  if(readingAll){
    window.speechSynthesis.cancel();
    readingAll = false;
    return;
  }
  readingAll = true;
  let i = 0;
  function next(){
    if(i >= words.length){ readingAll = false; return; }
    const u = new SpeechSynthesisUtterance(words[i]);
    u.lang = 'zh-CN';
    u.rate = 0.85;
    u.pitch = 1.05;
    if(zhVoice) u.voice = zhVoice;
    u.onend = () => { i++; setTimeout(next, 320); };
    window.speechSynthesis.speak(u);
  }
  next();
}

function speakCurrentUnitWords(){
  const d = UNIT_DATA[currentUnit];
  if(d) speakAll(d.words);
}

/* =========================================================
   6. 工具
   ========================================================= */
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function strip(s){
  return (s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[\s'’·]/g,'');
}
const LETTER = i => String.fromCharCode(65 + i);

function highlightWord(sentence, word){
  if(!word || !sentence) return sentence;
  return sentence.split(word).join(`<span class="hl">${word}</span>`);
}

function wrapLatin(sentence){
  return sentence.replace(/（[^）]*）/g, m => `<span class="latin">${m}</span>`);
}

function processSentence(sentence, word){
  return wrapLatin(highlightWord(sentence, word));
}

function attrEscape(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function markExerciseDone(exKey){
  if(!progress[currentUnit]) progress[currentUnit] = {};
  progress[currentUnit][exKey] = true;
  saveProgress(progress);
  updateProgressBar();
  checkUnitCompletion();
}

function checkUnitCompletion(){
  const p = progress[currentUnit];
  if(!p) return;
  if(p.ex1 && p.ex2 && p.ex3){
    if(!collectedFlowers.includes(currentUnit)){
      collectedFlowers.push(currentUnit);
      saveCollected(collectedFlowers);
      renderFlowerBtn();
      renderFlowerGrid();
      markUnitBtnCompleted(currentUnit);
      showFlowerToast(currentUnit);
    }
  }
}

function markUnitBtnCompleted(n){
  const btn = document.querySelector(`.unit-btn[data-unit="${n}"]`);
  if(btn) btn.classList.add('completed');
}

function updateProgressBar(){
  const p = progress[currentUnit] || {};
  const done = ['ex1','ex2','ex3'].filter(k => p[k]).length;
  const pct = Math.round(done / 3 * 100);
  const fill = document.querySelector('.progress-fill');
  const label = document.querySelector('.progress-label');
  if(fill) fill.style.width = pct + '%';
  if(label) label.innerHTML = `<b>${done}</b> / 3 bài tập · <b>${pct}%</b>`;
}

function isUnitDone(n){
  const p = progress[n] || {};
  return !!(p.ex1 && p.ex2 && p.ex3);
}

            <span class="opt-pill"><b>${LETTER(oi)}</b><span class="zh">${o}</span></span>`).join('')}
        </div>
        <ol class="fill-list">
          ${g.items.map((it,ii)=>{
            const parts = it.text.split('____');
            const sel = `<select class="fill-select" data-g="${gi}" data-i="${ii}">
                <option value="">选答案</option>
                ${g.options.map(o=>`<option value="${o}">${o}</option>`).join('')}
              </select>`;
            return `<li><span class="zh">${parts.join(sel)}</span></li>`;
          }).join('')}
        </ol>
      </div>`).join('')}
    <div class="btn-row">
      <button class="btn small" onclick="checkFill()">Kiểm tra đáp án</button>
      <button class="btn ghost small" onclick="resetFill()">Làm lại</button>
    </div>
  </div>`;
}

/* =========================================================
   13. 速练一：拼音检查
   ========================================================= */
function checkPinyin(){
  const data = UNIT_DATA[currentUnit];
  if(!data) return;
  const items = data.ex1;

  document.querySelectorAll('.py-input').forEach(inp=>{
    const idx = +inp.dataset.idx;
    const target = items[idx].p;
    const fb = inp.parentElement.querySelector('.py-fb');
    const ok = strip(inp.value) === strip(target);

    inp.classList.toggle('ok', ok);
    inp.classList.toggle('no', !ok && inp.value.trim() !== '');
    fb.textContent = ok ? '✓ chính xác' : (inp.value.trim() ? '✗ đáp án: ' + target : '');
    fb.style.color = ok ? '#2E9E67' : '#C0504D';
  });

  markExerciseDone('ex1');
}
function resetPinyin(){
  document.querySelectorAll('.py-input').forEach(inp=>{
    inp.value = '';
    inp.classList.remove('ok','no');
    inp.parentElement.querySelector('.py-fb').textContent = '';
  });
}

/* =========================================================
   14. 速练一：连线
   ========================================================= */
function initMatch(){
  matchSel = null;
  matchedCount = 0;
  updateMatchStatus();

  document.querySelectorAll('#matchLeft .match-item, #matchRight .match-item').forEach(btn=>{
    btn.addEventListener('click', onMatchClick);
  });
}

function onMatchClick(e){
  const btn = e.currentTarget;
  if(btn.classList.contains('matched')) return;

  if(!matchSel){
    document.querySelectorAll('.match-item.sel').forEach(b=>b.classList.remove('sel'));
    btn.classList.add('sel');
    matchSel = btn;
    return;
  }

  if(matchSel === btn){
    btn.classList.remove('sel');
    matchSel = null;
    return;
  }

  if(matchSel.dataset.side === btn.dataset.side){
    matchSel.classList.remove('sel');
    btn.classList.add('sel');
    matchSel = btn;
    return;
  }

  const left  = matchSel.dataset.side === 'L' ? matchSel : btn;
  const right = matchSel.dataset.side === 'R' ? matchSel : btn;

  if(left.dataset.key === right.dataset.key){
    left.classList.add('matched');
    right.classList.add('matched');
    left.classList.remove('sel');
    right.classList.remove('sel');
    matchedCount++;
    updateMatchStatus();
  }else{
    left.classList.add('wrong');
    right.classList.add('wrong');
    setTimeout(()=>{
      left.classList.remove('wrong');
      right.classList.remove('wrong');
    }, 600);
    left.classList.remove('sel');
    right.classList.remove('sel');
  }
  matchSel = null;
}

function updateMatchStatus(){
  const data = UNIT_DATA[currentUnit];
  const total = data ? data.ex1.length : 0;
  const el = document.getElementById('matchStatus');
  if(el) el.textContent = `Đã nối: ${matchedCount} / ${total}` + (matchedCount === total ? ' 🎉' : '');
}

function resetMatch(){
  matchSel = null;
  matchedCount = 0;
  document.querySelectorAll('.match-item').forEach(b=>{
    b.classList.remove('matched','sel','wrong');
  });
  updateMatchStatus();
}

/* =========================================================
   15. 速练二：选词填空
   ========================================================= */
function checkFill(){
  const data = UNIT_DATA[currentUnit];
  if(!data) return;

  document.querySelectorAll('.fill-select').forEach(sel=>{
    const gi = +sel.dataset.g;
    const ii = +sel.dataset.i;
    const correct = data.ex2[gi].items[ii].answer;
    const ok = sel.value === correct;

    sel.classList.toggle('ok', ok);
    sel.classList.toggle('no', !ok && sel.value !== '');
    if(!ok && sel.value !== '') sel.title = 'Đáp án đúng: ' + correct;
    else sel.title = '';
  });

  markExerciseDone('ex2');
}
function resetFill(){
  document.querySelectorAll('.fill-select').forEach(sel=>{
    sel.value = '';
    sel.classList.remove('ok','no');
    sel.title = '';
  });
}

/* =========================================================
   16. 速练三：选择
   ========================================================= */
function checkMC(){
  const data = UNIT_DATA[currentUnit];
  if(!data) return;

  document.querySelectorAll('.mc-item').forEach((li, qi)=>{
    const answer = data.ex3[qi].a;
    li.querySelectorAll('.mc-opt').forEach((btn, oi)=>{
      btn.classList.remove('ok','no');
      if(oi === answer) btn.classList.add('ok');
      else if(btn.classList.contains('sel')) btn.classList.add('no');
    });
  });

  markExerciseDone('ex3');
}
function resetMC(){
  document.querySelectorAll('.mc-opt').forEach(btn=>{
    btn.classList.remove('ok','no','sel');
  });
}

/* 点击选择 MC */
document.addEventListener('click', e=>{
  const btn = e.target.closest('.mc-opt');
  if(!btn) return;
  const li = btn.closest('.mc-item');
  li.querySelectorAll('.mc-opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
});

/* =========================================================
   17. 启动
   ========================================================= */
applyTheme();
renderNav();
renderFlowerBtn();
renderUnit(1);
</script>
